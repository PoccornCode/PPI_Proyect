<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Bloque / Tabla de subasta inferior -->
  <rect x="4" y="52" width="56" height="8" rx="4" fill="#658807"/>

  <!-- Martillo de subasta inclinado de alto impacto -->
  <g transform="rotate(-38 28 28)">
    <!-- Mango blanco marfil sólido -->
    <rect x="25" y="12" width="8" height="36" rx="4" fill="#ffffff"/>
    
    <!-- Cabeza del martillo en verde militar principal -->
    <rect x="7" y="2" width="44" height="19" rx="5.5" fill="#84b00b"/>
    
    <!-- Anillo central de contraste -->
    <rect x="26" y="0" width="6" height="23" rx="1.5" fill="#ffffff"/>
  </g>
</svg>
